<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CLI Scheduler{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>

<body{% block body_attrs %}{% endblock %}>
    <div class="container">
        <header>
            <h1><a href="{{ url_for('views.index') }}">CLI Scheduler</a></h1>
            <nav class="nav-links">
                <a href="{{ url_for('views.index') }}"
                    class="{{ 'active' if request.endpoint == 'views.index' else '' }}">Dashboard</a>
                <a href="{{ url_for('views.presets_list') }}"
                    class="{{ 'active' if request.endpoint == 'views.presets_list' else '' }}">Presets</a>
                <a href="{{ url_for('views.submit') }}" class="btn">+ New Job</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            {{ footer_text }}
            <span class="version">{{ version }}</span>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>

</html>
