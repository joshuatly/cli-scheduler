{% extends "base.html" %}

{% block title %}Dashboard - CLI Scheduler{% endblock %}

{% block content %}
<div class="card">
    <div class="toolbar">
        <label for="status-filter" style="margin: 0;">Filter:</label>
        <select id="status-filter" aria-label="Filter jobs by status">
            <option value="">All statuses</option>
            <option value="queued">Queued</option>
            <option value="running">Running</option>
            <option value="finished">Finished</option>
            <option value="failed">Failed</option>
            <option value="cancelled">Cancelled</option>
        </select>

        <button type="button" class="btn btn-ghost" id="refresh-now" title="Refresh now">↻ Refresh</button>

        <span class="live-indicator" id="live-indicator">
            <span class="dot"></span>
            <span class="label">Live</span>
            <span id="jobs-meta" class="text-muted" style="margin-left: 0.5rem;"></span>
        </span>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Preset</th>
                    <th>Input / Command</th>
                    <th>Timeline</th>
                    <th>Duration</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="jobs-tbody"></tbody>
        </table>
    </div>

    <div id="empty-state" class="empty-state" hidden>
        No jobs found. Start by creating one!
    </div>

    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
