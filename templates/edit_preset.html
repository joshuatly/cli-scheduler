{% extends "base.html" %}

{% block title %}Edit Preset - CLI Scheduler{% endblock %}

{% block content %}
<div class="card">
    <h3 style="margin-top: 0;">Edit Preset</h3>
    <form action="{{ url_for('views.update_preset') }}" method="POST">
        <input type="hidden" name="original_name" value="{{ preset.name }}">

        <div class="form-group">
            <label for="name">Preset Name</label>
            <input type="text" name="name" id="name" value="{{ preset.name }}" required>
        </div>
        <div class="form-group">
            <label for="command">Command Template</label>
            <input type="text" name="command" id="command" value="{{ preset.command }}" required>
            <small class="hint">Use <code>{url}</code> as placeholder.</small>
        </div>
        <div class="form-group">
            <label for="cwd">Working Directory (Optional)</label>
            <input type="text" name="cwd" id="cwd" value="{{ preset.cwd or '' }}" placeholder="Leave empty for default">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" name="description" id="description" value="{{ preset.description }}">
        </div>

        <div class="actions">
            <a href="{{ url_for('views.presets_list') }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn">Update Preset</button>
        </div>
    </form>
</div>
{% endblock %}
