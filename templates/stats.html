{% extends "base.html" %}

{% block title %}Stats – CLI Scheduler{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    text-align: center;
  }
  .stat-card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }
  .stat-card .value {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .stat-card .sub {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }
  .charts-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .charts-row-equal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
  }
  .chart-card h3 {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0 0 1rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .chart-wrap {
    position: relative;
  }
  .preset-table-wrap {
    overflow-x: auto;
  }
  .preset-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  .preset-table th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .preset-table td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  .preset-table tr:last-child td { border-bottom: none; }
  .preset-table .rate-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    background: var(--success);
    vertical-align: middle;
    margin-right: 0.4rem;
  }
  .time-saved-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: flex-start;
    gap: 2rem;
  }
  .time-saved-card .big {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .time-saved-card .explain {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 500px;
  }
  .empty-stats {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row, .charts-row-equal { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
{% endblock %}

{% block content %}
<div id="stats-root">
  <p class="text-muted">Loading stats…</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/format.js') }}"></script>
<script src="{{ url_for('static', filename='js/stats.js') }}"></script>
{% endblock %}
