name: Browser extension

on:
  push:
    branches: [main]
    tags: ["extension-v*"]
    paths: ["browser-extension/**", ".github/workflows/browser-extension.yml"]
  pull_request:
    paths: ["browser-extension/**", ".github/workflows/browser-extension.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: browser-extension

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.build.outputs.zip }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build
        id: build
        env:
          # On a release tag, the build fails unless the tag matches manifest.json.
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/extension-v') && github.ref_name || '' }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#extension-v}"
          zip=$(bash scripts/build.sh)
          echo "zip=$(basename "$zip")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./src/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-scheduler-sender
          path: browser-extension/dist/*.zip
          if-no-files-found: error

  # Publishes extension-v<manifest version> the first time that version reaches
  # main (or when such a tag is pushed). Later pushes with the same version
  # only build. Bump "version" in src/manifest.json to cut a new release.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: extension-v${{ needs.build.outputs.version }}
      ZIP: ${{ needs.build.outputs.zip }}
    steps:
      - name: Check whether this version is already released
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in manifest.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: cli-scheduler-sender
          path: dist

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" "dist/$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Browser extension ${TAG#extension-v}" \
            --generate-notes
