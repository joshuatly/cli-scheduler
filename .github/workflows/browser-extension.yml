name: Browser extension

on:
  push:
    branches: [main]
    tags: ["extension-v*"]
    paths: ["browser-extension/**", ".github/workflows/browser-extension.yml"]
  pull_request:
    paths: ["browser-extension/**", ".github/workflows/browser-extension.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: browser-extension

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.build.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build
        id: build
        env:
          # On a release tag, the build fails unless the tag matches manifest.json.
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/extension-v') && github.ref_name || '' }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#extension-v}"
          zip=$(bash scripts/build.sh)
          echo "zip=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-scheduler-sender
          path: browser-extension/dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-scheduler-sender
          path: dist

      - name: Create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          gh release create "$TAG" "dist/$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Browser extension ${TAG#extension-v}" \
            --generate-notes
